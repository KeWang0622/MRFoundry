name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch link rot

permissions:
  contents: read

jobs:
  structure:
    name: Structure & frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structure (JSON, frontmatter, registry vs folders)
        run: |
          python3 .github/scripts/validate_repo.py
      - name: Check project memory preservation
        run: python3 -m unittest discover -s .github/tests

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the 2.0.0 release commit rather than @master: a third-party
      # action tracked by moving ref can change under us between runs.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0

  upstreams:
    name: Upstreams exist (repos, DOIs, PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard-fails only on a definite error in this repo: a linked repository,
      # DOI, or PyPI package that does not exist. Archived/renamed upstreams are
      # warnings, and network trouble is reported as inconclusive.
      - name: Check every linked repo, DOI, and package resolves
        run: python3 .github/scripts/check_upstreams.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  freshness:
    name: Upstream freshness monitor
    # Scheduled/manual only: upstream archival is not a contributor's fault, so
    # it must not block a pull request. This is the job that would have caught
    # BART moving to Codeberg while every link still returned 200.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report archived, renamed, and dormant upstreams
        run: python3 .github/scripts/check_upstreams.py --warn-only --report-dormant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skills-cli:
    name: skills CLI detects all skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List skills via the skills CLI
        run: |
          npx -y skills@latest add . --list

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # Publisher pages (Wiley/Elsevier/RSNA/…) block bots with 403 but are
          # valid in a browser; GitHub can rate-limit with 429 — accept both.
          # IEEE returns a 202 bot response for this DOI. Validate its Crossref
          # registration record while retaining the canonical citation link.
          args: >-
            --accept 200,206,301,302,307,308,400,403,429
            --remap '^https://doi\.org/10\.1109/TMI\.2006\.885337$ https://api.crossref.org/works/10.1109/TMI.2006.885337'
            --max-concurrency 8
            --max-retries 3
            --timeout 30
            --no-progress
            "**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
